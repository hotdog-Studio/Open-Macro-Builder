# SonarQube project settings for Open Macro Builder. The Jenkins 'SonarQube Analysis' stage
# supplies host and token through withSonarQubeEnv(); this file only carries the source, test and
# exclusion config the scanner reads from the checkout.
#
# Local scan (same server and gate as Jenkins):
#   1. Put the credentials in `.env.sonar` at the repo root (gitignored):
#        SONAR_HOST_URL=https://<sonarqube-host>/
#        SONAR_TOKEN=<token>
#   2. Load them into the environment and run sonar-scanner with -Dsonar.qualitygate.wait=true.
# Never put sonar.token in this file: it is committed. .env.sonar is the place for secrets.
# Override the key per environment with -Dsonar.projectKey (Jenkins global OMB_SONAR_PROJECT_KEY)
# if SonarQube generated a different one on import.
sonar.projectKey=hotdog-Studio_open-macro-builder
sonar.projectName=open-macro-builder
sonar.projectVersion=2.0

# ── What SonarQube can read today ─────────────────────────────────────────────
# The config validator (scripts/, JavaScript) and the web configurator (configurator/src and
# configurator/electron, TypeScript) are analysed in full. SonarQube has no analyser for
# PowerShell or AutoHotkey, so powershell/ and ahk/ get only its text and secrets checks; their
# real tests run in the Jenkins 'Windows Tests' stage. The C# under powershell/lib/cs would need
# the SonarScanner for .NET and an MSBuild project, so it is left out rather than reported as
# unanalysable.

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=scripts,configurator/src,configurator/electron,powershell,ahk,config.json
sonar.sourceEncoding=UTF-8

# Assets, keyboard firmware config, docs, generated output (including the configurator's build
# folders), test files and test helpers (indexed only through sonar.tests) and the C# shim.
sonar.exclusions=\
  **/node_modules/**,\
  **/results/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  img/**,\
  qmk/**,\
  docs/**,\
  **/*.cs,\
  scripts/**/*.test.mjs,\
  configurator/**/*.test.ts,\
  configurator/**/*.test.tsx,\
  configurator/**/*.test.mjs,\
  configurator/test/**,\
  configurator/dist/**,\
  configurator/dist-electron/**,\
  powershell/tests/**,\
  ahk/tests/**

# ── Tests ─────────────────────────────────────────────────────────────────────
# node:test specs beside the scripts; Vitest specs beside the configurator's code (src/, electron/)
# and its launcher scripts, with shared helpers in configurator/test; Pester suites in
# powershell/tests; AutoHotkey check scripts in ahk/tests. A folder may sit in both lists: test
# files are excluded from sources above and picked out here, so no file is indexed twice.
sonar.tests=scripts,configurator/src,configurator/electron,configurator/scripts,configurator/test,powershell/tests,ahk/tests
sonar.test.inclusions=\
  scripts/**/*.test.mjs,\
  configurator/**/*.test.ts,\
  configurator/**/*.test.tsx,\
  configurator/**/*.test.mjs,\
  configurator/test/**,\
  powershell/tests/**,\
  ahk/tests/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# The 'Run Script Tests' stage writes lcov for scripts/ with node --experimental-test-coverage;
# the 'Configurator Test' stage writes it for configurator/ with Vitest (v8 coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/configurator/lcov.info
