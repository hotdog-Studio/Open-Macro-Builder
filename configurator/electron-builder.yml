# Builds the Windows installer and the portable exe: `npm run dist` writes both into release/.
# The package holds only the built app, whose page carries the starter copy of the scripts and icons. Nothing from local/ (personal data), src/ or test/ goes in.
appId: studio.hotdog.openmacrobuilder
productName: Open Macro Builder
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  # Source maps carry the source and the build machine's paths; the app does not need them.
  - '!**/*.map'
asar: true
# The logo, as the web page has it, for the window: electron/main.ts finds it beside app.asar.
extraResources:
  - from: ../img/logo.ico
    to: logo.ico
win:
  # The logo, for the program and its installer; it has a 256x256 image, which the installer needs. The
  # macropads' tray keeps the hotdog (img/icon.ico), so a running macropad and the configurator are told apart.
  icon: ../img/logo.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub turns a space in a release file's name into a dot.
  artifactName: "Open-Macro-Builder-Setup-${version}.${ext}"
portable:
  artifactName: "Open-Macro-Builder-${version}-portable.${ext}"
